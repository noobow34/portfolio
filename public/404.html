<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Cancelled</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/main.js" defer></script>
</head>
<body>
  <main class="section">
    <div class="wrap">
      <div class="board" role="table" aria-label="404">
        <div class="board-row board-head mono" role="row">
          <span role="columnheader">FLIGHT</span><span role="columnheader">DESTINATION</span>
          <span role="columnheader">PATH</span><span role="columnheader">STATUS</span>
        </div>
        <div class="board-row mono" role="row">
          <span role="cell">NB 404</span><span role="cell">NOT FOUND</span>
          <span role="cell">—</span><span role="cell" class="st-off">CANCELLED</span>
        </div>
      </div>
      <p>お探しのページは欠航しました。</p>
      <a class="btn btn-primary" href="/">トップへ戻る</a>
      <button class="theme-btn" type="button" id="theme-btn" hidden></button>
    </div>
  </main>
</body>
</html>
